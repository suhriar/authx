<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AuthX</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <img class="brand-mark" src="public/assets/icon48.png" alt="" aria-hidden="true">
        <div>
          <h1>AuthX</h1>
          <p id="siteLine">Cookie session exporter</p>
        </div>
        <span class="badge" id="tabBadge">Checking</span>
      </header>

      <section class="section">
        <div class="section-title">
          <h2>Account</h2>
        </div>
        <label>
          Username
          <input id="username" name="username" autocomplete="username" placeholder="Username">
        </label>
        <label>
          Password
          <span class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password">
            <button
              id="togglePassword"
              class="icon-button password-toggle"
              type="button"
              aria-label="Show password"
              title="Show password"
            >
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 3 18 18"></path>
                <path d="M10.7 5.2A10.5 10.5 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.2 4.1"></path>
                <path d="M6.6 6.6A17 17 0 0 0 2.5 12s3.5 7 9.5 7a9.8 9.8 0 0 0 4.1-.9"></path>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
              </svg>
            </button>
          </span>
        </label>
        <label>
          TOTP Secret
          <input id="totpSecret" name="totpSecret" autocomplete="off" spellcheck="false" placeholder="FBTSCVXXXXXXXXXXXX">
        </label>
      </section>

      <section class="section" id="batchSection" hidden>
        <div class="section-title">
          <h2>Batch Usernames</h2>
          <span id="batchCount">0 names</span>
        </div>
        <label>
          Platform
          <select id="batchPlatform" name="batchPlatform">
            <option value="twitter">Twitter/X</option>
            <option value="instagram">Instagram</option>
          </select>
        </label>
        <label>
          Username list
          <textarea id="batchUsernames" name="batchUsernames" spellcheck="false" placeholder="nayav4r&#10;anggunmikapg5e&#10;geayubihs"></textarea>
        </label>
      </section>

      <section class="section batch-report" id="batchReportSection" hidden>
        <div class="section-title">
          <h2>Batch Report</h2>
          <div class="report-title-actions">
            <span id="batchReportSummary">0 success, 0 failed</span>
            <button id="clearBatchReport" class="tiny-button" type="button">Clear</button>
          </div>
        </div>
        <div class="report-columns">
          <div class="report-list">
            <strong>Berhasil</strong>
            <ul id="batchSuccessList"></ul>
          </div>
          <div class="report-list">
            <strong>Gagal</strong>
            <ul id="batchFailedList"></ul>
          </div>
        </div>
      </section>

      <section class="status-section">
        <div class="status" id="status">Ready</div>
        <div class="workflow-actions">
          <button id="loginExport" class="primary full" type="button">Login</button>
          <button id="stopWorkflow" class="danger-button full" type="button" hidden>Stop</button>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
