<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AuthX</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <img class="brand-mark" src="public/assets/icon48.png" alt="" aria-hidden="true">
        <div>
          <h1>AuthX</h1>
          <p id="siteLine">Cookie session exporter</p>
        </div>
        <span class="badge" id="tabBadge">Checking</span>
      </header>

      <section class="section" id="batchSection">
        <div class="section-title">
          <h2>Batch Usernames</h2>
          <span id="batchCount">0 names</span>
        </div>
        <label>
          Username list
          <textarea id="batchUsernames" name="batchUsernames" spellcheck="false" placeholder="nayav4r&#10;anggunmikapg5e&#10;geayubihs"></textarea>
        </label>
      </section>

      <section class="section batch-report" id="batchReportSection" hidden>
        <div class="section-title">
          <h2>Batch Report</h2>
          <div class="report-title-actions">
            <span id="batchReportSummary">0 success, 0 failed</span>
            <button id="clearBatchReport" class="tiny-button" type="button">Clear</button>
          </div>
        </div>
        <div class="report-columns">
          <div class="report-list">
            <strong>Berhasil</strong>
            <ul id="batchSuccessList"></ul>
          </div>
          <div class="report-list">
            <strong>Gagal</strong>
            <ul id="batchFailedList"></ul>
          </div>
        </div>
      </section>

      <section class="status-section">
        <div class="status" id="status">Ready</div>
        <div class="workflow-actions">
           <button id="loginExport" class="primary full" type="button">Batch Login</button>
          <button id="stopWorkflow" class="danger-button full" type="button" hidden>Stop</button>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
